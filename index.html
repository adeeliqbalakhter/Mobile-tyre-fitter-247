<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d92a1d" />

    <!--
      NO static <title>, <meta description>, <link canonical> or og/twitter
      tags here on purpose. This is a static-site-generated app: vite-react-ssg
      prerenders the correct, UNIQUE per-page title/description/canonical/OG/
      Twitter tags (via the SEOHead component) directly into each page's HTML.
      A static tag here would be DUPLICATED on every page and a static canonical
      pointing at "/" would tell Google every page is a copy of the homepage,
      preventing all inner pages from being indexed. Keep SEO tags in SEOHead.
    -->

    <!-- Icons + manifest -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Mobile Tyre Fitter 24/7" />

    <!-- Performance: preconnect to font hosts + async font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
    <link rel="preload" as="image" href="/images/hero-bg.webp" fetchpriority="high" />

    <!--
      Google Consent Mode v2 (EU/GDPR).
      Consent defaults to DENIED for all non-essential storage until the visitor
      opts in via the cookie banner. This block must run before any Google tag.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      window.gtag = gtag;
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted',
        wait_for_update: 500
      });
      // Privacy-safe Google Ads measurement while consent is denied.
      gtag('set', 'url_passthrough', true);
      gtag('set', 'ads_data_redaction', true);
      // Re-apply a returning visitor's saved choice as early as possible.
      try {
        var saved = JSON.parse(localStorage.getItem('cookie-consent') || 'null');
        if (saved && saved.consent) { gtag('consent', 'update', saved.consent); }
      } catch (e) {}
    </script>

    <!--
      Google Tag Manager, ready to activate.
      Set your container ID below (e.g. 'GTM-XXXXXXX'). GTM is where you add your
      GA4 and Google Ads tags. Nothing loads until an ID is set.
    -->
    <script>
      window.GTM_ID = 'GTM-KDHZR3HS'; // GTM container id
      if (window.GTM_ID) {
        (function (w, d, s, l, i) {
          w[l] = w[l] || []; w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
          var f = d.getElementsByTagName(s)[0], j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : '';
          j.async = true; j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
          f.parentNode.insertBefore(j, f);
        })(window, document, 'script', 'dataLayer', window.GTM_ID);
      }
    </script>

    <!--
      Google Analytics 4 (optional, if you load GA4 directly instead of via GTM).
      Set your Measurement ID below (e.g. 'G-XXXXXXXXXX'). Nothing loads until set.
    -->
    <script>
      window.GA_MEASUREMENT_ID = 'G-471W29B34X'; // GA4 Measurement ID
      if (window.GA_MEASUREMENT_ID) {
        var gaScript = document.createElement('script');
        gaScript.async = true;
        gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + window.GA_MEASUREMENT_ID;
        document.head.appendChild(gaScript);
        gtag('js', new Date());
        gtag('config', window.GA_MEASUREMENT_ID);
      }
    </script>

    <!--
      Core business + services structured data (static, so search engines and
      AI crawlers that don't run JavaScript still get the full picture).
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["AutoRepair", "LocalBusiness"],
        "@id": "https://www.mobiletyrefitter247.co.uk/#business",
        "name": "Mobile Tyre Fitter 24/7",
        "url": "https://www.mobiletyrefitter247.co.uk/",
        "image": "https://www.mobiletyrefitter247.co.uk/images/hero-bg.webp",
        "logo": "https://www.mobiletyrefitter247.co.uk/images/logo.png",
        "telephone": "+448001234567",
        "email": "info@mobiletyrefitter247.co.uk",
        "description": "24/7 mobile tyre fitting across the UK. Emergency tyre replacement at your home, work, or roadside, with an average 30-45 minute response. We supply and fit all major tyre brands.",
        "priceRange": "££",
        "currenciesAccepted": "GBP",
        "paymentAccepted": "Cash, Credit Card, Debit Card, Apple Pay, Google Pay",
        "openingHoursSpecification": [{
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
          "opens": "00:00",
          "closes": "23:59"
        }],
        "areaServed": [
          { "@type": "Country", "name": "United Kingdom" },
          { "@type": "City", "name": "London" },
          { "@type": "City", "name": "Manchester" },
          { "@type": "City", "name": "Birmingham" },
          { "@type": "City", "name": "Glasgow" },
          { "@type": "City", "name": "Leeds" },
          { "@type": "City", "name": "Liverpool" },
          { "@type": "City", "name": "Bristol" },
          { "@type": "City", "name": "Leicester" },
          { "@type": "City", "name": "Newcastle" }
        ],
        "serviceType": [
          "Emergency mobile tyre fitting",
          "24 hour tyre fitting",
          "Same day tyre fitting",
          "Mobile tyre replacement",
          "Home tyre fitting",
          "Workplace tyre fitting",
          "Fleet tyre services"
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Mobile Tyre Services",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Emergency Mobile Tyre Fitting", "url": "https://www.mobiletyrefitter247.co.uk/emergency-mobile-tyre-fitting" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Mobile Tyre Replacement", "url": "https://www.mobiletyrefitter247.co.uk/mobile-tyre-replacement" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Home Tyre Fitting", "url": "https://www.mobiletyrefitter247.co.uk/home-tyre-fitting" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Workplace Tyre Fitting", "url": "https://www.mobiletyrefitter247.co.uk/workplace-tyre-fitting" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Fleet Tyre Services", "url": "https://www.mobiletyrefitter247.co.uk/fleet-tyre-services" } }
          ]
        },
        "aggregateRating": { "@type": "AggregateRating", "ratingValue": "4.9", "reviewCount": "2500" }
      }
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KDHZR3HS" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <!--
      No content <noscript> fallback here on purpose. This app is statically
      generated (SSG), so every page's real, UNIQUE content and headings are
      already prerendered into its HTML for crawlers. A generic noscript block
      here would inject a duplicate top-level heading and identical boilerplate
      onto all 79 pages (two headings per page, duplicate content sitewide).
      The GTM noscript iframe above is kept because it must run without JS.
    -->

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
